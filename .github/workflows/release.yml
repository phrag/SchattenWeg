name: Release

# Build the APK and publish it to GitHub Releases so a working, installable
# build is always one download away (linked from inside the app — see
# MapScreen.kt's ProjectLink). Three shapes of release:
#
#   * push to main  -> the rolling NIGHTLY pre-release (release-key-signed),
#                      tag "latest", retagged to the new commit, so the newest
#                      build is always downloadable at the stable URL linked
#                      from the README and the app:
#                      /releases/download/latest/schattenweg-latest.apk
#   * every night   -> the same nightly rebuild from the unchanged main, so
#                      its cameras are never more than a day behind OSM
#                      (scheduled runs always use the default branch)
#   * push a v* tag -> a permanent STABLE release for that tag
#   * manual run    -> a throwaway build-<run> pre-release
#
# Every run regenerates the offline Berlin assets from a freshly downloaded
# extract (scripts/build_map_assets.sh), so a released APK maps and routes out
# of the box. Non-tag builds also pull the cameras live from Overpass, so they
# carry the cameras OpenStreetMap has right now. Only the heavy,
# slow-changing inputs (Planetiler + its natural-earth/water sources, the font
# pack) are cached; the extract and the rendered tiles never are.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  schedule:
    # Nightly, 05:07 UTC: after Geofabrik's daily Berlin extract, which was
    # observed published at 03:27 UTC (one day's sample), leaving margin for a
    # late publish; off the hour, when scheduled runs queue up. Cameras are
    # pulled live from Overpass regardless; the extract supplies roads/buildings.
    # GitHub switches scheduled workflows off after 60 days without repository
    # activity; any push re-enables them.
    - cron: "7 5 * * *"
  workflow_dispatch:

# Creating a release and uploading assets needs write access to the repo's
# contents; the default token is otherwise read-only (see ci.yml).
permissions:
  contents: write

concurrency:
  # One release build at a time per ref; a newer push supersedes an in-flight one.
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    env:
      # Signed with the release key: v* tags and pushes/manual runs ON main.
      # Any other ref (a manual run from a branch) stays debug-signed and the
      # steps that read the secrets are skipped.
      SIGNED: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      # Two JDKs: the Android build wants 17 (jvmToolchain(17)), Planetiler
      # wants 21+. 17 is listed last so it wins JAVA_HOME (Gradle uses it);
      # the asset step below reaches for $JAVA_HOME_21_X64 explicitly.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools", but the legacy "tools" package
          # was removed from cmdline-tools and now fails ("Failed to find
          # package 'tools'"). We only need platform-tools; the NDK, build-tools
          # and platform are installed below / fetched by Gradle on demand.
          packages: platform-tools

      # Keep in step with ndkVersion in app/build.gradle.kts.
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust with Android targets
        # rust-toolchain.toml pins the version and both Android targets.
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # osmium filters the extract to streets + surveillance nodes; unzip pulls
      # the Latin glyph ranges out of the font pack. Both are used by
      # scripts/build_map_assets.sh.
      - name: Install osmium & unzip
        run: sudo apt-get update && sudo apt-get install -y osmium-tool unzip

      # Cache only the big, slow-changing build inputs: the Planetiler jar and
      # its ~1.4 GB of natural-earth / water-polygon sources, and the font pack.
      # NOT the OSM extract and NOT the rendered tiles -- those are rebuilt every
      # run so the bundled cameras stay current.
      - name: Cache Planetiler sources and font pack
        uses: actions/cache@v4
        with:
          path: |
            data/planetiler-*.jar
            data/planetiler-sources
            data/noto-sans.zip
          key: mapassets-inputs-planetiler-v0.10.2-fonts-v2.0

      # Generate the offline Berlin data the app bundles: routing snapshot,
      # label glyphs and vector basemap tiles, all copied into
      # app/src/main/assets/map/. This is the ONE network step (Geofabrik +
      # Planetiler sources); it runs here on the builder, never on the phone.
      # Planetiler needs Java 21, so this step overrides the Gradle-facing 17.
      # REFRESH=1 forces the current extract even if a cache ever retained one,
      # so the cameras in the APK are always the latest.
      #
      # LIVE_CAMERAS pulls the cameras straight from OpenStreetMap (Overpass,
      # one query) instead of the up-to-a-day-old extract, falling back to the
      # extract's own cameras if Overpass is down. Tagged releases (Stable) keep
      # the extract's data so they are reproducible.
      - name: Build offline map assets (live cameras)
        env:
          REFRESH: "1"
          LIVE_CAMERAS: ${{ github.ref_type == 'tag' && '0' || '1' }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          ./scripts/build_map_assets.sh

      # Release signing. Tags and main MUST produce a release-key-signed APK:
      # the job fails rather than publishing a debug-signed "release". Other
      # refs stay debug-signed and never see the secrets.
      # The keystore is base64 in a repo secret and exists only on the runner's
      # temp dir for this job; it never touches the workspace or git.
      - name: Decode release keystore
        id: signing
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SCHATTENWEG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SCHATTENWEG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCHATTENWEG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCHATTENWEG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Repo secret for $v is missing; a release build must be signed."
              exit 1
            fi
          done
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "store=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      # Signed refs: minified release build (no .debug id suffix). Anything
      # else: the debug APK with the Berlin data bundled, debug-signed.
      - name: Assemble release APK (signed)
        if: env.SIGNED == 'true'
        env:
          SCHATTENWEG_STORE_FILE: ${{ steps.signing.outputs.store }}
          SCHATTENWEG_STORE_PASSWORD: ${{ secrets.SCHATTENWEG_STORE_PASSWORD }}
          SCHATTENWEG_KEY_ALIAS: ${{ secrets.SCHATTENWEG_KEY_ALIAS }}
          SCHATTENWEG_KEY_PASSWORD: ${{ secrets.SCHATTENWEG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Assemble debug APK
        if: env.SIGNED != 'true'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify release signature
        if: env.SIGNED == 'true'
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          apksigner="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose --print-certs "$apk" | tee sig.txt
          if grep -qi "Android Debug" sig.txt; then
            echo "::error::Release APK is signed with the debug certificate."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check for Google/Play Services dependencies
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon \
            > deps.txt
          if grep -Ei "com\.google\.android\.gms|play-services|firebase" deps.txt; then
            echo "::error::Play Services / Firebase dependency found — see CLAUDE.md"
            exit 1
          fi
          echo "No Play Services or Firebase in the dependency tree."

      # Work out which of the three release shapes this run is, name the APK, and
      # assemble notes that state exactly how current the bundled cameras are
      # (from data/build-info.txt, written by build_map_assets.sh).
      - name: Prepare release metadata
        id: meta
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"

          osm_snapshot="unknown"; cameras="unknown"; surveillance="unknown"; built_utc="unknown"
          camera_source="geofabrik"; extract_snapshot="unknown"
          if [ -f data/build-info.txt ]; then
            # shellcheck disable=SC1091
            . data/build-info.txt
            osm_snapshot="${osm_snapshot:-unknown}"
            surveillance="${surveillance_nodes:-unknown}"
            cameras="${cameras:-unknown}"
            built_utc="${built_utc:-unknown}"
            camera_source="${camera_source:-geofabrik}"
            extract_snapshot="${extract_snapshot:-unknown}"
          fi

          # Published next to the APK: the README's badges read the build date
          # and camera count from it (shields.io dynamic JSON badges).
          # osm_snapshot is the camera data's own date; camera_data is its full
          # UTC timestamp (Overpass' when pulled live, the extract's otherwise).
          jq -n --arg built "${built_utc%%T*}" --arg osm "${osm_snapshot%%T*}" \
            --arg cameras "$cameras" --arg commit "$short_sha" \
            --arg camdata "$osm_snapshot" --arg src "$camera_source" \
            --arg extract "$extract_snapshot" \
            '{built: $built, osm_snapshot: $osm, camera_data: $camdata, camera_source: $src, extract_snapshot: $extract, cameras: $cameras, commit: $commit}' \
            > build-info.json
          cat build-info.json

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"; prerelease=false; title="$GITHUB_REF_NAME"; label="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            tag="latest"; prerelease=true; title="Nightly build (main@$short_sha, OSM $osm_snapshot)"; label="latest"
          else
            tag="build-$GITHUB_RUN_NUMBER"; prerelease=true; title="build-$GITHUB_RUN_NUMBER"; label="build-$GITHUB_RUN_NUMBER"
          fi

          # The rolling build's asset name must NOT contain the commit: the
          # README links straight to
          #   releases/download/latest/schattenweg-latest.apk
          # and that URL only stays valid if the name never changes.
          if [ "$SIGNED" = "true" ]; then
            # Tagged releases use one fixed name so that
            #   releases/latest/download/schattenweg.apk
            # is always a direct download of the newest signed version (the
            # version lives in the release tag, not the file name).
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then apk="schattenweg.apk"; else apk="schattenweg-${label}.apk"; fi
            cp "$(ls app/build/outputs/apk/release/*.apk | head -n1)" "$apk"
          else
            apk="schattenweg-${label}-debug.apk"
            cp "$(ls app/build/outputs/apk/debug/*.apk | head -n1)" "$apk"
          fi

          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "title=$title"
            echo "apk=$apk"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Offline build of SchattenWeg with the Berlin map data bundled"
            echo "(routing snapshot + vector basemap + labels), so it maps and"
            echo "routes out of the box."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$short_sha\` |"
            echo "| Built (UTC) | $built_utc |"
            if [ "$camera_source" = "overpass" ]; then
              echo "| Camera data (live from OpenStreetMap) | $osm_snapshot |"
              echo "| Roads and buildings (Geofabrik extract) | $extract_snapshot |"
            else
              echo "| Camera data (Geofabrik extract) | $osm_snapshot |"
            fi
            echo "| Cameras routed around | $cameras (of $surveillance surveillance nodes) |"
            echo ""
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "**Signed with the SchattenWeg release key.** Verify the"
              echo "certificate fingerprint against SECURITY.md before installing."
            elif [ "$SIGNED" = "true" ]; then
              echo "**Development build** of \`main\`: unreleased code, but signed"
              echo "with the SchattenWeg release key, so it installs over (and is"
              echo "updated by) versioned releases. Verify the certificate"
              echo "fingerprint against SECURITY.md before installing."
            else
              echo "**Debug-signed** with the \`.debug\` application-id suffix —"
              echo "installable and usable, but not signed with a release key."
            fi
            echo ""
            echo "Fully offline: the app declares no \`INTERNET\` permission."
            echo "Berlin only, for now."
          } > release-notes.md

          # A tagged release leads with its CHANGELOG.md section (## <version>).
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            awk -v v="$version" '
              $1 == "##" && $2 == v { on = 1; next }
              $1 == "##" { on = 0 }
              on
            ' CHANGELOG.md > changelog-section.md
            if grep -q '[^[:space:]]' changelog-section.md; then
              { cat changelog-section.md; echo; cat release-notes.md; } > release-notes.new
              mv release-notes.new release-notes.md
            else
              echo "::warning::CHANGELOG.md has no '## $version' section"
            fi
          fi
          echo "--- release notes ---"; cat release-notes.md

      # Rolling "latest": move the tag to this commit by replacing the release.
      - name: Publish rolling latest release
        if: steps.meta.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "${{ steps.meta.outputs.apk }}" build-info.json \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file release-notes.md \
            --prerelease

      # Versioned tag or manual build-<run>: create the release, or just replace
      # its APK asset if the tag already has one.
      - name: Publish tagged / manual release
        if: steps.meta.outputs.tag != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "${{ steps.meta.outputs.title }}" --notes-file release-notes.md)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.apk }}" build-info.json "${flags[@]}" \
            || gh release upload "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.apk }}" build-info.json --clobber

      # Also attach the APK to the workflow run, so it is retrievable even if the
      # release step is skipped (e.g. a fork without contents:write).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.meta.outputs.apk }}
          if-no-files-found: error
