name: Probe extract

on:
  push:
    branches: [claude/project-thread-t2o8ux]
    paths: [.github/workflows/probe-extract.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          for u in \
            https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf \
            https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf.md5 \
            https://download.geofabrik.de/europe/germany/berlin.html \
            https://download.geofabrik.de/europe/germany.html \
            https://download.geofabrik.de/index-v1-nogeom.json \
            https://download.bbbike.org/osm/bbbike/Berlin/Berlin.osm.pbf \
            https://download.bbbike.org/osm/bbbike/Berlin/Berlin.osm.pbf.md5 \
            https://download.bbbike.org/osm/bbbike/Berlin/CHECKSUM.txt \
            https://download.openstreetmap.fr/extracts/europe/germany/berlin.osm.pbf \
            https://download.openstreetmap.fr/extracts/europe/germany/ ; do
            echo "== $u"
            curl -sSIL -m 30 "$u" | grep -iE '^(HTTP|location|content-length|last-modified)' 
          done
          echo '== geofabrik index: berlin entries'
          curl -sSL -m 60 https://download.geofabrik.de/index-v1-nogeom.json -o /tmp/idx.json
          python3 - <<'E'
          import json
          d=json.load(open('/tmp/idx.json'))
          for f in d['features']:
              p=f['properties']
              if 'berlin' in (p.get('id','')+p.get('name','')).lower() or 'brandenburg' in p.get('id',''):
                  print(json.dumps(p,indent=1))
          E
          echo '== germany.html mentions'
          curl -sSL -m 30 https://download.geofabrik.de/europe/germany.html | grep -io 'berlin[^"<> ]*' | sort -u
          echo '== brandenburg-berlin?'
          curl -sSIL -m 30 https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf | grep -iE '^(HTTP|content-length)'
          echo '== bbbike checksum'
          curl -sSL -m 30 https://download.bbbike.org/osm/bbbike/Berlin/Berlin.osm.pbf.md5
          curl -sSL -m 30 https://download.bbbike.org/osm/bbbike/Berlin/ | head -60
