name: Probe polygon

on:
  push:
    branches: [claude/project-thread-t2o8ux]
    paths: [.github/workflows/probe-poly.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Berlin boundary as .poly
        run: |
          cat > /tmp/poly.py <<'PY'
          import json, sys, math
          d = json.load(open('/tmp/rel.json'))
          rel = d['elements'][0]
          outers, inners = [], []
          for m in rel['members']:
              if m['type'] != 'way' or 'geometry' not in m: continue
              pts = [(p['lon'], p['lat']) for p in m['geometry']]
              (outers if m['role'] == 'outer' else inners).append(pts)
          def stitch(ways):
              ways = [w[:] for w in ways]; rings = []
              while ways:
                  ring = ways.pop(0)
                  while ring[0] != ring[-1]:
                      for i, w in enumerate(ways):
                          if w[0] == ring[-1]: ring += w[1:]
                          elif w[-1] == ring[-1]: ring += w[::-1][1:]
                          elif w[-1] == ring[0]: ring = w[:-1] + ring
                          elif w[0] == ring[0]: ring = w[::-1][:-1] + ring
                          else: continue
                          ways.pop(i); break
                      else:
                          sys.exit('could not close ring')
                  rings.append(ring)
              return rings
          def rdp(p, eps):
              if len(p) < 3: return p
              (x1, y1), (x2, y2) = p[0], p[-1]
              dx, dy = x2 - x1, y2 - y1
              n = math.hypot(dx, dy) or 1e-12
              idx, dm = 0, 0
              for i in range(1, len(p) - 1):
                  dd = abs(dy * p[i][0] - dx * p[i][1] + x2 * y1 - y2 * x1) / n
                  if dd > dm: idx, dm = i, dd
              if dm > eps:
                  return rdp(p[:idx + 1], eps)[:-1] + rdp(p[idx:], eps)
              return [p[0], p[-1]]
          out = ['berlin']
          for k, r in enumerate(stitch(outers), 1):
              s = rdp(r[:-1], 0.00004) + [r[0]]
              out.append(str(k)); out += ['   %.6f   %.6f' % q for q in s]; out.append('END')
          for k, r in enumerate(stitch(inners), 1):
              s = rdp(r[:-1], 0.00004) + [r[0]]
              out.append('!%d' % (100 + k)); out += ['   %.6f   %.6f' % q for q in s]; out.append('END')
          out.append('END')
          open('/tmp/berlin.poly', 'w').write('\n'.join(out) + '\n')
          print('outer rings', len(outers), 'inner', len(inners), 'lines', len(out), file=sys.stderr)
          PY
          for i in 1 2 3 4; do
            curl -sS -m 120 -A "schattenweg-build/1.0 (+https://github.com/phrag/SchattenWeg)" \
              --data-urlencode 'data=[out:json][timeout:90];rel["boundary"="administrative"]["admin_level"="4"]["name"="Berlin"];out geom;' \
              https://overpass-api.de/api/interpreter -o /tmp/rel.json && grep -q '"elements"' /tmp/rel.json && break
            sleep 20
          done
          python3 /tmp/poly.py
          echo '=====POLY-BEGIN'
          cat /tmp/berlin.poly
          echo '=====POLY-END'
          wc -c /tmp/berlin.poly
      - name: Geofabrik poly for comparison
        continue-on-error: true
        run: |
          curl -sSL -m 60 https://download.geofabrik.de/europe/germany/berlin/berlin.poly -o /tmp/gf.poly && wc -l /tmp/gf.poly && head -5 /tmp/gf.poly
