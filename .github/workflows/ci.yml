name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ktlint:
    name: Kotlin style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to match the version developers run locally; rules are
      # configured in .editorconfig (Compose-tuned — see the comments there).
      - name: Install ktlint
        run: |
          curl -fsSL -o /usr/local/bin/ktlint \
            https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x /usr/local/bin/ktlint

      # Only our own sources: the UniFFI bindings under java/uniffi/ are
      # generated at build time (and gitignored), so they are never linted.
      - name: Check Kotlin style
        run: |
          ktlint \
            "app/src/main/java/de/schattenweg/**/*.kt" \
            "*.gradle.kts" "app/*.gradle.kts"

  core:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Installs exactly what rust-toolchain.toml pins, components included.
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # Keep in step with ndkVersion in app/build.gradle.kts.
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust with Android targets
        run: |
          # rust-toolchain.toml pins the version and both Android targets,
          # so rustup provisions them here without a second source of truth.
          rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # No map assets in git (they are ~100 MB and regenerable); the app is
      # built without them and falls back to an empty basemap. See
      # scripts/build_map_assets.sh.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Check for Google/Play Services dependencies
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon \
            > deps.txt
          if grep -Ei "com\.google\.android\.gms|play-services|firebase" deps.txt; then
            echo "::error::Play Services / Firebase dependency found — see CLAUDE.md"
            exit 1
          fi
          echo "No Play Services or Firebase in the dependency tree."

      - uses: actions/upload-artifact@v4
        with:
          name: schattenweg-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  hygiene:
    name: No PII, paths or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A surveillance-avoidance tool leaking its author's identity in the
      # repo would be its own kind of joke. Tracked files must not carry
      # developer usernames, machine-local paths, or credentials.
      - name: Scan tracked files
        run: |
          fail=0

          # Home directories and machine-local paths. The example keystore
          # deliberately shows a placeholder absolute path, so it is exempt.
          if git grep -nIE '/Users/[a-z0-9]|/home/[a-z0-9]|C:\\Users\\[A-Za-z0-9]|/opt/homebrew' \
               -- . ':!keystore.properties.example' \
                    ':!.github/workflows/ci.yml' ':!.githooks/pre-commit'; then
            echo "::error::machine-local path in a tracked file"
            fail=1
          fi

          # Real email addresses. Anthropic's noreply and Android resource
          # references (@string/, @drawable/, ...) are not addresses.
          if git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . \
               ':!.github/workflows/ci.yml' ':!.githooks/pre-commit' \
               | grep -vE 'noreply@anthropic\.com|example\.com|@aar|@types'; then
            echo "::error::email address in a tracked file"
            fail=1
          fi

          # Credential material. Signing keys live outside the repo entirely.
          if git grep -nIE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}' \
               -- . ':!.github/workflows/ci.yml' ':!.githooks/pre-commit'; then
            echo "::error::secret-shaped string in a tracked file"
            fail=1
          fi

          # Files that carry local paths or keys by their very nature.
          if git ls-files | grep -E '(^|/)(local\.properties|keystore\.properties|\.DS_Store)$|\.(jks|keystore|p12|pem)$'; then
            echo "::error::a file that must never be tracked is tracked"
            fail=1
          fi

          [ "$fail" = 0 ] && echo "Clean: no PII, local paths or secrets in tracked files."
          exit $fail
